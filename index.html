<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RETRO-PSX · محرك ألعاب 3D</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: #000; overflow: hidden;
      font-family: "Courier New", monospace;
      cursor: crosshair;
    }
    /* The canvas is rendered tiny internally and upscaled by CSS.
       'pixelated' keeps the chunky retro pixels crisp. */
    #game {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    /* Subtle scanline + vignette overlay for that old CRT-on-XP vibe. */
    #crt {
      position: absolute; inset: 0;
      pointer-events: none;
      background:
        repeating-linear-gradient(
          to bottom,
          rgba(0,0,0,0) 0px,
          rgba(0,0,0,0) 2px,
          rgba(0,0,0,0.18) 3px,
          rgba(0,0,0,0) 4px
        ),
        radial-gradient(ellipse at center,
          rgba(0,0,0,0) 55%, rgba(0,0,0,0.55) 100%);
      mix-blend-mode: multiply;
    }
    #hud {
      position: absolute; left: 0; right: 0; bottom: 8px;
      text-align: center;
      color: #9ef0a0;
      font-size: 13px;
      letter-spacing: 1px;
      text-shadow: 0 0 4px rgba(80,255,120,0.6);
      pointer-events: none;
      z-index: 3;
    }
    #title {
      position: absolute; top: 14px; left: 0; right: 0;
      text-align: center; z-index: 3;
      color: #7fd4ff;
      font-size: 11px; letter-spacing: 3px;
      text-shadow: 0 0 6px rgba(80,180,255,0.6);
      pointer-events: none;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="crt"></div>
  <div id="title">★ RETRO-PSX ENGINE ★</div>
  <div id="hud">CLICK TO PLAY</div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
